name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artifact: awss3destroyer-linux,     binary: s3destroyer }
          - { goos: darwin,  goarch: arm64, artifact: awss3destroyer-mac,       binary: s3destroyer }
          - { goos: darwin,  goarch: amd64, artifact: awss3destroyer-mac-amd64, binary: s3destroyer }
          - { goos: windows, goarch: amd64, artifact: awss3destroyer-windows,   binary: s3destroyer.exe }
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      run: go build -v -trimpath -ldflags="-s -w" -o dist/${{ matrix.binary }} .

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: dist/${{ matrix.binary }}
        if-no-files-found: error
